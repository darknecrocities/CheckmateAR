<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="logoPlatinum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E4E4E7"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>
    <linearGradient id="logoObsidian" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 8)">
    <rect width="64" height="64" rx="16" fill="url(#logoObsidian)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2"/>
    <path d="M 8 18 V 8 H 18" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 46 8 H 56 V 18" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 56 46 V 56 H 46" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 18 56 H 8 V 46" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Queen Coronet -->
    <path d="M 18 48 L 15 30 L 23 37 L 32 20 L 41 37 L 49 30 L 46 48 Z" fill="url(#logoPlatinum)" stroke="#09090B" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="15" cy="28" r="2" fill="#FFFFFF"/>
    <circle cx="23" cy="35" r="1.6" fill="#18181B" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="32" cy="18" r="2.5" fill="#FFFFFF" stroke="#09090B" stroke-width="1"/>
    <circle cx="41" cy="35" r="1.6" fill="#18181B" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="49" cy="28" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <text x="88" y="38" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.5">CHECKMATE</text>
  <text x="246" y="38" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" letter-spacing="-0.5">AR</text>
  <text x="89" y="55" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2">SPATIAL CHESS INTELLIGENCE</text>
